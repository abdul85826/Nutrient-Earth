name: nutrient_earth
description: Nutrient Earth App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.12.4

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  file_picker: ^8.0.0+1
  lottie: 3.1.0
  smooth_page_indicator: 1.1.0
  shared_preferences: 2.2.3
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1

  path_provider: ^2.1.5
  path: ^1.9.1

  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  
  # New Additions
  video_player: ^2.9.1
  fl_chart: ^0.69.0
  pedometer: ^4.0.1
  flutter_animate: ^4.5.0
  permission_handler: ^11.3.1
  battery_plus: ^6.1.0
  connectivity_plus: ^6.0.4
  device_info_plus: ^10.1.2
  uuid: ^4.5.3
  flutter_stripe: 12.0.0
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: 3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - .env.example
    - .env.development
    - .env.production
    - assets/images/
    - assets/icons/
    - assets/lottie/