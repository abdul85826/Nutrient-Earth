name: Server CI Pipeline

on:
  push:
    branches: [main, staging, dev]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main, staging, dev]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  server-test:
    name: Python Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nutrientearth
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: nutrientearth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install arq alembic sentry-sdk[fastapi] structlog pgvector ruff mypy pytest pytest-asyncio

      - name: Code Formatting & Linting Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Execute Server Substrate Test Suite
        env:
          ENVIRONMENT: local
          DATABASE_URL: postgresql+asyncpg://nutrientearth:test_password_ci@localhost:5432/nutrientearth_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/test_substrate.py
