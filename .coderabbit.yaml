# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"
tone_instructions: "You are a Principal Software Architect and Security Auditor. Focus strictly on architectural integrity, soundness, security vulnerabilities, Supabase RLS isolation, sound null safety, and clean engineering conventions."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "feat/pr-*"
      - "feat/*"
  path_filters:
    - "!**/*.lock"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/*.mocks.dart"
    - "!android/**"
    - "!ios/**"
    - "!macos/**"
    - "!windows/**"
    - "!linux/**"
    - "!web/**"
    - "!.agents/**"
    - "!.gsd/**"
    - "!build/**"
    - "!.dart_tool/**"
    - "!scratch/**"

chat:
  auto_reply: true
