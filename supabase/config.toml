[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.nutrientearth.win"
additional_redirect_urls = [
  "https://www.nutrientearth.win/**",
  "https://www.nutrientearth.win/auth/callback",
  "https://nutrientearth.win/**",
  "https://nutrientearth.win/auth/callback",
  "https://www.nutrientearth.vercel.app/**",
  "https://www.nutrientearth.vercel.app/auth/callback",
  "https://nutrientearth.vercel.app/**",
  "https://nutrientearth.vercel.app/auth/callback",
  "https://nutrient-earth.vercel.app/**",
  "https://nutrient-earth.vercel.app/auth/callback",
  "http://localhost:3000/**",
  "http://localhost:5000/**",
  "http://localhost:5656/**",
  "com.nutrientearth.nutrient_earth_client://login-callback",
  "io.supabase.nutrientearth://login-callback"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "15MiB"
