<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Nutrient Earth</title>
  <meta name="description" content="Nutrient Earth — Precision Health, Nutrition & Botanical Protocol">

  <base href="$FLUTTER_BASE_HREF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nutrient_earth_client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Preload core brand emblem -->
  <link rel="preload" href="assets/images/app_logo.png" as="image">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FBF9F4;
      overflow: hidden;
    }
    #ne-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FBF9F4;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }
    .ne-boot-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(11, 43, 38, 0.12);
      border: 1px solid #c1c8c4;
      object-fit: cover;
    }
    .ne-boot-spinner {
      margin-top: 20px;
      width: 28px;
      height: 28px;
      border: 2.5px solid #E2E7DF;
      border-top-color: #163B32;
      border-radius: 50%;
      animation: ne-spin 0.8s linear infinite;
    }
    @keyframes ne-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Cloudflare Turnstile Explicit JavaScript API -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div id="ne-boot-loader">
    <img class="ne-boot-logo" src="assets/images/app_logo.png" onerror="this.onerror=null; this.src='icons/Icon-192.png';" alt="Nutrient Earth">
    <div style="margin-top: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.22em; color: #0B2B26; text-transform: uppercase;">NUTRIENT EARTH</div>
    <div style="margin-top: 4px; font-family: monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #4F6359; text-transform: uppercase;">EVIDENCE COMPANION</div>
    <div class="ne-boot-spinner"></div>
  </div>

  <script>
    // Invalidate stale caches immediately upon boot
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].update();
        }
      });
    }

    // Dismiss preloader once Flutter renders first element
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('ne-boot-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 350);
      }
    });

    // Fallback timer: dismiss loader after 4 seconds regardless
    setTimeout(function() {
      var loader = document.getElementById('ne-boot-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 350);
      }
    }, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
