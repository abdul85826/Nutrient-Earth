<script>
  (function initBrandPulse() {
    const root = document.querySelector('.min-h-\\[820px\\]');
    if (!root) return;
    
    let isTapped = false;
    root.addEventListener('click', () => {
      if (isTapped) return;
      isTapped = true;
      const centerLogo = root.querySelector('img');
      if (centerLogo) {
        centerLogo.style.transform = 'scale(0.97)';
        centerLogo.style.transition = 'transform 200ms ease';
        setTimeout(() => {
          centerLogo.style.transform = 'scale(1)';
        }, 220);
      }
      setTimeout(() => { isTapped = false; }, 600);
    });
  })();
</script></main>

<script id="ne-flutter-bridge-core">
  window.NEBridge = {
    send: function(type, payload) {
      var msg = Object.assign({ type: type }, payload || {});
      var jsonStr = JSON.stringify(msg);
      if (window.FlutterBridge && typeof window.FlutterBridge.postMessage === 'function') {
        window.FlutterBridge.postMessage(jsonStr);
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*');
      }
      console.log('[NEBridge] ' + type, msg);
    },
    navigate: function(route) {
      this.send('NAVIGATE', { route: route });
    }
  };
</script>


<script id="ne-screen-wiring">
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    console.log('[Stitch] Screen 01 loaded');
    window.NEBridge.send('SPLASH_READY', { timestamp: Date.now() });

    // Tap to skip splash or auto-advance
    document.body.addEventListener('click', function() {
      window.NEBridge.send('SPLASH_TAP', { timestamp: Date.now() });
      window.NEBridge.navigate('/welcome');
    });

    setTimeout(function() {
      window.NEBridge.navigate('/welcome');
    }, 2400);
  });
})();
</script>
